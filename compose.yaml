services:
  seirama-api-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: seirama-api-mcp:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8003), 5); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s